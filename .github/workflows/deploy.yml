name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: mcp-nevent
  ECS_CLUSTER: production
  ECS_SERVICE: mcp-nevent
  TASK_FAMILY: mcp-nevent
  CONTAINER_NAME: mcp-nevent

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and tag image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG=$(date +'%Y-%m-%d-%H-%M')-$(git rev-parse --short HEAD)
          IMAGE=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          docker build --build-arg COMMIT_SHA=${{ github.sha }} -t $IMAGE .
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "Built: $IMAGE"

      # Reporting scan (non-blocking): CRITICAL + HIGH findings are uploaded to
      # the GitHub Security tab for triage. Never stops the deploy.
      - name: Scan image with Trivy (report)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # Ordered mirrors with fallback so a registry rate limit while
          # downloading the vulnerability DB cannot block a production deploy.
          TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
        with:
          image-ref: ${{ steps.build-image.outputs.image }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          trivyignores: '.trivyignore'

      - name: Upload Trivy results to GitHub Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-container'

      # Gate (blocking): a CRITICAL vulnerability that already has a fix stops
      # the pipeline BEFORE the image is pushed or deployed. To unblock an
      # urgent deploy, fix the dependency or add the CVE to .trivyignore with a
      # written justification.
      - name: Scan image with Trivy (gate on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # Ordered mirrors with fallback so a registry rate limit while
          # downloading the vulnerability DB cannot block a production deploy.
          TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
        with:
          image-ref: ${{ steps.build-image.outputs.image }}
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          trivyignores: '.trivyignore'

      - name: Push image to ECR
        run: |
          docker push ${{ steps.build-image.outputs.image }}
          echo "Pushed: ${{ steps.build-image.outputs.image }}"

      - name: Get current task definition and update image
        id: register-task-def
        run: |
          # Fetch the current task definition JSON
          aws ecs describe-task-definition \
            --task-definition ${{ env.TASK_FAMILY }} \
            --query 'taskDefinition' \
            > task-def.json

          # Update the image for our container
          jq --arg IMAGE "${{ steps.build-image.outputs.image }}" \
             --arg CONTAINER "${{ env.CONTAINER_NAME }}" \
             '.containerDefinitions = [.containerDefinitions[] | if .name == $CONTAINER then .image = $IMAGE else . end]' \
             task-def.json > updated-task-def.json

          # Strip read-only fields that cannot be present in a register request
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
             updated-task-def.json > register-task-def.json

          # Register the new revision
          NEW_TASK_DEF=$(aws ecs register-task-definition \
            --cli-input-json file://register-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "new-task-def=$NEW_TASK_DEF" >> $GITHUB_OUTPUT
          echo "Registered new task definition: $NEW_TASK_DEF"

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition ${{ steps.register-task-def.outputs.new-task-def }} \
            --force-new-deployment
          echo "ECS service update initiated"

      - name: Wait for deployment to stabilize
        run: |
          echo "Waiting for ECS service to stabilize (timeout: 10 min)..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}
          echo "Deployment complete — service is stable"
